<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>数独本</title>
    <link rel="stylesheet" href="/src/interface/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="title-group">
          <p class="eyebrow">SUDOKU NOTEBOOK</p>
          <h1>数独本</h1>
          <span class="header-puzzle-title" id="puzzle-title" hidden></span>
        </div>
        <nav class="game-menu" id="game-menu" aria-label="游戏菜单" hidden>
          <button id="back-to-directory" type="button">返回题库</button>
        </nav>
      </header>

      <section class="directory-view" id="directory-view" aria-label="题库">
        <div class="directory-heading">
          <div>
            <p class="eyebrow">PUZZLE INDEX</p>
            <h2>题库</h2>
          </div>
          <p>一本留在这台设备上的数独书</p>
        </div>
        <div class="difficulty-tabs" id="difficulty-tabs" role="tablist" aria-label="题目难度"></div>
        <div class="directory-summary" id="directory-summary"></div>
        <div class="puzzle-list" id="puzzle-list"></div>
        <nav class="pagination" id="pagination" aria-label="题目分页"></nav>
      </section>

      <section class="game-layout" id="game-view" aria-label="数独游戏" hidden>
        <div class="board-panel">
          <div class="game-info-strip">
            <p class="game-information" id="game-information">
              <span>当前用时 <strong id="timer">00:00</strong></span>
              <span aria-hidden="true">·</span>
              <span>最佳用时 <strong id="best-time">—</strong></span>
            </p>
            <p class="status" id="status" aria-live="polite" hidden></p>
          </div>
          <div class="board" id="board" role="grid" aria-label="九乘九数独棋盘"></div>
        </div>

        <aside class="controls" aria-label="输入面板">
          <div class="control-grid">
            <button class="side-action" id="reset" type="button">清空重做</button>
            <div class="number-pad" id="number-pad"></div>
            <button class="side-action primary" id="submit" type="button">提交检查</button>
          </div>
        </aside>
      </section>
    </main>

    <script type="module" src="/src/interface/app.js"></script>
  </body>
</html>
